<style id="sheet">
/* Layout: sticky brand bar, compact search band, 2-col product grid on phones; owner tools live in a bar above the grid. */
:root{

*{box-sizing:border-box}

.crown{fill:var(--gold);width:100%;height:100%}

/* header */

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}

.cartbtn{display:flex;align-items:center;gap:8px;border:0;background:#fff;color:var(--brand);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}
.cartbtn b{background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}

/* owner bar */

.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--danger)}

/* hero + chips */
.hero{padding-block:22px 6px;display:grid;gap:12px}
.hero h2{font:700 clamp(22px,5.5vw,34px)/1.12 var(--display);letter-spacing:-.015em;margin:0;max-width:22ch;text-wrap:balance}
.search{width:100%;max-width:520px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:14px;padding-bottom:110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}

.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;padding-bottom:140px}
.card{padding:10px;border-radius:18px;box-shadow:0 3px 14px rgba(209,18,43,.09)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(209,18,43,.18)}
.card .cbody{padding:6px 8px 10px;gap:6px}
.card .pname{font-size:16px}
.card .price{font-size:18px}
}
@media (min-width:1500px){.wrap{max-width:1360px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

.social{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;color:var(--ink)}
.social b{margin-right:4px}
.foot .social a{color:var(--brand);border:1.5px solid var(--brand);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;text-decoration:none}
.foot .social a:hover{background:var(--brand);color:var(--brand-ink)}

.foot .social a{display:inline-flex;align-items:center;gap:7px}
.social svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* tagline: green text, black outline */
.hero h2{color:#19A04B;-webkit-text-stroke:1.6px #000;paint-order:stroke fill;font-size:clamp(20px,5vw,29px);line-height:1.18;letter-spacing:.01em}
@media (min-width:900px){.hero h2{font-size:40px;-webkit-text-stroke:2px #000}}

/* tagline: black banner behind text only */
.hero h2{background:#000;border-radius:14px;padding:12px 16px;box-sizing:border-box;width:calc(100% - 104px);-webkit-text-stroke:0;text-shadow:none}
@media (min-width:900px){.hero h2{width:calc(100% - 210px);padding:18px 26px;border-radius:18px}}

/* tagline: black text, soft shadow, no banner */
.hero h2{background:none;border-radius:0;padding-block:0;padding-left:0;width:auto;color:#111;-webkit-text-stroke:0;text-shadow:0 2px 4px rgba(0,0,0,.28),0 1px 1px rgba(0,0,0,.18)}
@media (min-width:900px){.hero h2{padding:0 200px 0 0;width:auto}}

/* discount bar */
.promo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:2px dashed var(--red,#D0112B);color:#111;border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;margin-top:2px}
.promo[hidden]{display:none}
.promo .pk{background:var(--red,#D0112B);color:#fff;border-radius:8px;padding:4px 9px;font-weight:800;letter-spacing:.02em}
.promo b{letter-spacing:.08em;color:var(--red,#D0112B)}
@media (min-width:900px){.promo{font-size:16px;width:calc(100% - 210px)}}
@media (max-width:899px){.promo{width:calc(100% - 104px);font-size:13px}}
.pcode{display:flex;gap:8px;margin:8px 0}
.pcode input{flex:1;min-width:0;text-transform:uppercase}
.pcode .btn{width:auto;padding-inline:16px}
.ok{color:#0E7C46;font-weight:600;font-size:14px;margin:0 0 6px}
.tot.sub{font-weight:500;font-size:15px;opacity:.8}
.chk{display:flex;align-items:center;gap:8px}.chk input{width:auto}

/* product counter */
.pcount{color:#7B4A2B;font:600 15px/1.2 var(--body);margin:2px 2px 10px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.pcount[hidden]{display:none}
.pcount b{font:800 20px/1 var(--display,var(--body));color:#6B3A1E;margin-right:4px;display:inline-block;min-width:1ch}
@media (min-width:900px){.pcount{font-size:17px}.pcount b{font-size:24px}}

/* payment */
.pm{display:grid;gap:8px;margin:12px 0 4px}.pml{font-weight:700;font-size:14px}
.pmo{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;cursor:pointer;font-weight:600}
.pmo.on{border-color:var(--red,#D0112B);background:#FFF1F3}
.pmo input{width:auto;margin:0;accent-color:#D0112B}
.paybox{background:#FFF8EC;border:1.5px dashed #D9A441;border-radius:12px;padding:12px;margin:6px 0 10px}
.pbn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.pbn span{font:800 20px/1 var(--display,var(--body));letter-spacing:.04em}
.pbn .btn{width:auto;padding:8px 14px}
.pbt{font-size:14px;margin-bottom:4px}

  '<span class="tag">Owner mode</span>'+

function openDetail(id){
  var p=prod(id);if(!p)return;
  track('view_item',{currency:'PKR',value:p.price,items:[gaItem(p)]});
  var im=imgsOf(p),off=(p.oldPrice&&p.oldPrice>p.price)?Math.round((1-p.price/p.oldPrice)*100):0;

  var strip=im.length>1?'<div class="strip">'+im.map(function(u,i){return '<button type="button" data-act="pic" data-i="'+i+'" aria-label="Photo '+(i+1)+'"'+(i===0?' aria-current="true"':'')+'><img src="'+esc(u)+'" alt=""></button>'}).join('')+'</div>':'';
  modal('<div class="dtop"><button class="btn ghost sm" type="button" data-act="close">&larr; Back</button><span class="dtitle">'+esc(state.settings.name)+'</span></div>'+
  '<div class="dpic"><div class="car" id="car">'+slides+'</div>'+(im.length>1?'<span class="cnt" id="cnt">1 / '+im.length+'</span>':'')+(p.soldOut?'<span class="badge so">Sold out</span>':(off?'<span class="badge">-'+off+'%</span>':''))+'</div>'+strip+
  '<div class="dbody">'+(p.category?'<span class="cat">'+esc(p.category)+'</span>':'')+'<h3>'+esc(p.name)+'</h3>'+
  '<div class="prices"><span class="price">'+money(p.price)+'</span>'+(off?'<span class="old">'+money(p.oldPrice)+'</span>':'')+'</div>'+specs(p)+
  (p.desc?'<p class="desc full">'+esc(p.desc)+'</p>':'')+'</div>'+
  '<div class="dbar"><button class="btn" type="button" data-act="addcart-d" data-id="'+esc(p.id)+'"'+(p.soldOut?' disabled':'')+'>'+(p.soldOut?'Sold out':'Add to cart')+'</button>'+
  (owner?'<button class="btn ghost" type="button" data-act="edit" data-id="'+esc(p.id)+'">Edit</button>':'')+'</div>','full');
  var car=document.getElementById('car');
  if(car&&im.length>1)car.addEventListener('scroll',function(){
    var i=Math.round(car.scrollLeft/car.clientWidth);
    document.getElementById('cnt').textContent=(i+1)+' / '+im.length;
    document.querySelectorAll('.panel .strip button').forEach(function(x,k){if(k===i)x.setAttribute('aria-current','true');else x.removeAttribute('aria-current')});
  },{passive:true});
}
function openZoom(id,i){
  var p=prod(id);if(!p)return;var im=imgsOf(p);if(!im.length)return;
  var z=document.createElement('div');z.id='zoom';
  z.innerHTML='<button type="button" class="zx" data-act="zoomclose" aria-label="Close photo">&times;</button><div class="zcar" id="zcar">'+im.map(function(u,k){return '<div class="zs"><img src="'+esc(u)+'" alt="'+esc(p.name)+' photo '+(k+1)+'"></div>'}).join('')+'</div>'+(im.length>1?'<span class="zcnt" id="zcnt">'+(i+1)+' / '+im.length+'</span>':'');

function renderGrid(){

    if(cat!=='All'&&p.category!==cat)return false;

var gaLoaded=false;
function initAnalytics(){
  var id=state.settings.gaId;
  if(gaLoaded||owner||!id||!/^G-[A-Z0-9]{4,}$/i.test(id))return;
  gaLoaded=true;
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){window.dataLayer.push(arguments)};
  window.gtag('js',new Date());window.gtag('config',id);
  var sc=document.createElement('script');sc.async=true;sc.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(id);document.head.appendChild(sc);
}
function track(name,params){if(gaLoaded&&window.gtag){try{window.gtag('event',name,params||{})}catch(e){}}}
function gaItem(p,q){return {item_id:p.id,item_name:p.name,item_category:p.category||'',price:p.price,quantity:q||1}}
function waNum(x){var n=String(x||'').replace(/\D/g,'');if(n.indexOf('00')===0)n=n.slice(2);else if(n.charAt(0)==='0')n='92'+n.slice(1);return n}
function cleanUrl(v){v=String(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{var u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.indexOf('.')>0?u.href:''}catch(e){return ''}}
function socialHtml(st){
  var G={
    c:'<path d="M4 5h16v11h-9.5L4 20z"/>',
    i:'<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
    m:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    v:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 11l5-3v8l-5-3z"/>'};
  var items=[['Facebook',st.fb,'c'],['Instagram',st.ig,'i'],['TikTok',st.tt,'m'],['YouTube',st.yt,'v']].filter(function(x){return x[1]});
  if(!items.length)return '';
  return '<div class="social"><b>Follow us</b>'+items.map(function(x){return '<a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true">'+G[x[2]]+'</svg>'+x[0]+'</a>'}).join('')+'</div>';

function renderFoot(){

  c+=socialHtml(st);
  $('#foot').innerHTML=c+(owner?'<p>Owner mode. Your changes are saved on this phone. Tap Publish changes to show them to customers. <a href="#" data-act="exit">Exit owner mode</a></p>':'<p>'+esc('© '+st.name)+'</p>');
}
var shownCount=-1,countRaf=0;
function renderCount(){
  var el=$('#pcount');if(!el)return;
  var n=(state.products||[]).length;
  if(loading||!n){el.hidden=true;shownCount=-1;return}
  el.hidden=false;
  var word=n===1?' product':' products';
  if(n===shownCount)return;
  var from=shownCount<0?0:shownCount;shownCount=n;
  var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  cancelAnimationFrame(countRaf);
  if(reduce||from===n){el.innerHTML='<b>'+n+'</b>'+word;return}
  var dur=Math.min(500+n*40,1500),t0=null;
  function step(t){
    if(t0===null)t0=t;
    var k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3),v=Math.round(from+(n-from)*e);
    el.innerHTML='<b>'+v+'</b>'+(v===1?' product':' products');
    if(k<1)countRaf=requestAnimationFrame(step);else el.innerHTML='<b>'+n+'</b>'+word;
  }
  var go=function(){countRaf=requestAnimationFrame(step)};
  if(document.getElementById('welcome')){
    el.innerHTML='<b>'+from+'</b>'+(from===1?' product':' products');
    var w=setInterval(function(){if(!document.getElementById('welcome')){clearInterval(w);go()}},120);
  }else go();
}

function opts(list,sel){return list.map(function(u){return '<option'+(u===sel?' selected':'')+'>'+u+'</option>'}).join('')}

function shrink(file,max,type,qual){return new Promise(function(res,rej){
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    var x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(type,qual))};
  img.onerror=function(){URL.revokeObjectURL(url);rej()};img.src=url})}

function buildDoc(){
  var reset=':root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    HEAD+'<style id="sheet">'+$('#sheet').textContent+'</style>'+
    '<div id="hdr"><div class="wrap bar" id="bar"></div></div><div id="own"></div><main class="wrap"><section class="hero"><h2 id="tag"></h2><div class="promo" id="promo" hidden></div><div class="sbar"><input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off"><button class="btn addbtn" type="button" data-act="addnew">+ Add product</button></div></section><div class="pcount" id="pcount" hidden></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div><div class="foot" id="foot"></div></main><div id="fab"></div><div id="modal"></div><div id="toast" role="status" aria-live="polite" hidden></div>'+
    '<script type="application/json" id="data">'+json+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>';
}
function ghGet(){var c={};try{c=JSON.parse(localStorage.getItem('zc-gh')||'{}')}catch(e){}return c}
function ghRepoGuess(){var h=location.hostname;if(/\.github\.io$/.test(h)){var r=location.pathname.split('/')[1];return h.split('.')[0]+'/'+(r||h)}return ''}
function b64(t){var b=new TextEncoder().encode(t),o='',i;for(i=0;i<b.length;i+=32768)o+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(o)}
function ghHead(t){return {Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}}
async function ghList(repo,t){var l;try{l=await fetch('https://api.github.com/repos/'+repo+'/contents/?ref=main&t='+Date.now(),{headers:ghHead(t),cache:'no-store'})}catch(e){throw {code:'net'}}if(!l.ok)throw {code:l.status};var a=await l.json();return Array.isArray(a)?a:[]}
async function ghWrite(repo,t,path,c64,sha,retry){
  var body={message:'Update store',content:c64,branch:'main'};if(sha)body.sha=sha;
  var w;try{w=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead(t)),body:JSON.stringify(body)})}catch(e){throw {code:'net'}}
  if(!w.ok){if((w.status===409||w.status===422)&&!retry){var f=(await ghList(repo,t)).find(function(x){return x.name===path});return ghWrite(repo,t,path,c64,f&&f.sha,true)}throw {code:w.status}}
}
async function ghRemove(repo,t,path,sha){try{await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},ghHead(t)),body:JSON.stringify({message:'Remove logo',sha:sha,branch:'main'})})}catch(e){}}
async function publish(btn){
  var c=ghGet(),repo=c.repo||ghRepoGuess();
  if(!c.token||!repo){openSettings();toast('First paste your GitHub token at the bottom of Store settings.');return}
  btn.disabled=true;btn.textContent='Publishing...';
  try{
    var list=await ghList(repo,c.token),sj=list.find(function(x){return x.name==='store.json'}),lp=list.find(function(x){return x.name==='logo.png'});
    await ghWrite(repo,c.token,'store.json',b64(JSON.stringify(state)),sj&&sj.sha);
    var lg=state.settings.logo,pend=false;try{pend=localStorage.getItem('zc-logo-pending')==='1'}catch(e){}
    if(lg&&/^data:image\/png;base64,/.test(lg)){if(pend||!lp){await ghWrite(repo,c.token,'logo.png',lg.split(',')[1],lp&&lp.sha);try{localStorage.removeItem('zc-logo-pending')}catch(e){}}}
    else if(!lg&&lp){await ghRemove(repo,c.token,'logo.png',lp.sha);try{localStorage.removeItem('zc-logo-pending')}catch(e){}}
    dirty=0;persist();toast('Published. Customers will see the update in 1 to 2 minutes.')}
  catch(err){var m=err&&err.code;
    toast(m===401?'GitHub did not accept the token. Create a new token and paste it again.':(m===403||m===404)?'The token cannot write to "'+repo+'". Give it Contents: Read and write access to that repository.':m==='net'?'No internet. Try again.':'Could not publish ('+(m||'error')+'). Try again.')}
  renderOwner();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='ovl'){closeModal();return}
  if(e.target.id==='wa'){if(!cust.name.trim()||!cust.phone.trim()||!cust.addr.trim()){e.preventDefault();toast('Enter your name, phone number and delivery address first.')}else{track('begin_checkout',{currency:'PKR',value:total(),items:cartItems().map(function(i){return gaItem(i.p,i.qty)})});notifyOrder()}return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='cat'){cat=b.dataset.cat;renderChips();renderGrid()}
  else if(a==='addcart'){cart[id]=(cart[id]||0)+1;saveCart();renderBar();renderFab();toast('Added to cart')}
  else if(a==='cart')openCart();
  else if(a==='applypromo'){if(promoUsed){promoUsed=false;renderFab();openCart()}else{var v=($('#pcin').value||'').trim().toUpperCase();if(v&&v===state.settings.promoCode.trim().toUpperCase()){promoUsed=true;renderFab();openCart();track('select_promotion',{promotion_id:v})}else{var er=$('#pcerr');if(er)er.hidden=false}}}
  else if(a==='inc'||a==='dec'){cart[id]=Math.max(0,(cart[id]||0)+(a==='inc'?1:-1));if(!cart[id])delete cart[id];saveCart();renderBar();renderFab();openCart()}
  else if(a==='copypay'){var v=b.dataset.v||'';var done=function(){toast('Copied: '+v)};try{navigator.clipboard.writeText(v).then(done,function(){toast(v)})}catch(x){toast(v)}}
  else if(a==='close')closeModal();
  else if(a==='add')openProduct();
  else if(a==='exit'){e.preventDefault();owner=false;try{localStorage.removeItem('zc-owner')}catch(x){}renderAll()}
  else if(a==='addnew'){owner=true;try{location.hash='#admin'}catch(x){}renderAll();openProduct()}
  else if(a==='welcome'){var w=$('#welcome');if(w)w.remove();document.body.style.overflow=''}
  else if(a==='edit')openProduct(id);
  else if(a==='settings')openSettings();
  else if(a==='publish')publish(b);
  else if(a==='mkmain'){var mi=+b.dataset.i,mx=editing.imgs.splice(mi,1)[0];editing.imgs.unshift(mx);refreshGal()}
  else if(a==='rmimg'){editing.imgs.splice(+b.dataset.i,1);refreshGal()}
  else if(a==='pic'){var cr=document.getElementById('car');if(cr)cr.scrollTo({left:(+b.dataset.i)*cr.clientWidth,behavior:'smooth'})}
  else if(a==='zoom')openZoom(id,+b.dataset.i)
  else if(a==='zoomclose'){var zz=document.getElementById('zoom');if(zz)zz.remove()}
  else if(a==='smile'){b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');toast('Thank you for visiting!')}
  else if(a==='open')openDetail(id);
  else if(a==='addcart-d'){var ap=prod(id);if(ap)track('add_to_cart',{currency:'PKR',value:ap.price,items:[gaItem(ap)]});cart[id]=(cart[id]||0)+1;saveCart();renderBar();renderFab();closeModal();toast('Added to cart')}
  else if(a==='rmlogo'){editing.logo='';$('#lth').innerHTML=CROWN}
  else if(a==='del'){
    if(b.dataset.armed){state.products=state.products.filter(function(p){return p.id!==id});delete cart[id];saveCart();dirty++;persist();closeModal();renderAll();toast('Deleted on this phone. Tap Publish to update customers.')}
    else{b.dataset.armed='1';b.textContent='Tap again to delete'}}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='pf')saveProduct();
  else if(e.target.id==='sf')saveSettings();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value.trim();renderGrid();return}
  if(t.id==='cn'||t.id==='cp'||t.id==='ca'){
    cust={name:$('#cn').value,phone:$('#cp').value,addr:$('#ca').value};
    var w=$('#wa');if(w)w.href=waLink()}
});
document.addEventListener('change',function(e){
  var t=e.target,f=t.files&&t.files[0];
  if(t.name==='pm'){payMethod=t.value;openCart();return}
  if(t.id==='pimg'&&t.files.length){
    var room=Math.max(10-editing.imgs.length,0),fl=Array.prototype.slice.call(t.files,0,room);
    $('#perr').textContent=t.files.length>room?'Only 10 photos fit per product. The extra photos were skipped.':'';
    Promise.all(fl.map(function(x){return shrink(x,640,'image/jpeg',.72).catch(function(){return null})})).then(function(r){r.forEach(function(u){if(u)editing.imgs.push(u)});refreshGal();t.value=''})}
  if(t.id==='limg'&&f){shrink(f,280,'image/png').then(function(u){editing.logo=u;$('#lth').innerHTML='<img src="'+esc(u)+'" alt="">'}).catch(function(){toast('That logo could not be read. Try a PNG or JPG.')})}
});
(function(){
  function show(){var m=document.getElementById('smile');if(m&&m.hidden){m.hidden=false;m.classList.add('pop')}}
  if(!document.getElementById('welcome'))show();
  else new MutationObserver(function(r,o){if(!document.getElementById('welcome')){o.disconnect();setTimeout(show,250)}}).observe(document.body,{childList:true});
})();
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches&&e.target.matches('.card[data-act=open]')){e.target.click();return}if(e.key==='Escape'){if($('#zoom')){$('#zoom').remove()}else if($('#welcome')){$('#welcome').remove();document.body.style.overflow=''}else if($('#ovl'))closeModal()}});

var ownerFlag=false;try{ownerFlag=localStorage.getItem('zc-owner')==='1'}catch(e){}
if(location.hash==='#admin'){try{localStorage.setItem('zc-owner','1')}catch(e){}ownerFlag=true}
function updateWelcome(){
  try{localStorage.setItem('zc-brand',JSON.stringify({logo:state.settings.logo||'',welcome:state.settings.welcome,tagline:state.settings.tagline||''}))}catch(e){}
  var w=document.getElementById('welcome');if(!w)return;
  document.getElementById('wlogo').innerHTML=logoHtml();
  document.getElementById('wtext').textContent=state.settings.welcome;
  var t=document.getElementById('wtag');t.textContent=state.settings.tagline||'';t.hidden=!state.settings.tagline;
}
function remote(){return Promise.race([fetch('store.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),new Promise(function(r){setTimeout(function(){r(null)},3000)})])}
var draft=null;if(ownerFlag){try{draft=JSON.parse(localStorage.getItem('zc-draft')||'null')}catch(e){}}
owner=ownerFlag;renderBar();renderOwner();
if(draft&&draft.state){state=draft.state;norm();dirty=draft.dirty||0;loading=false;renderAll();initAnalytics()}
else{
  var cachedRaw=null,cached=null;try{cachedRaw=localStorage.getItem('zc-cache');cached=JSON.parse(cachedRaw||'null')}catch(e){}
  if(cached&&Array.isArray(cached.products)){state=cached;norm();loading=false;renderAll();updateWelcome();initAnalytics()}
  else{renderGrid();renderCount();renderFoot()}
  remote().then(function(r){
    if(r&&Array.isArray(r.products)){
      var raw=JSON.stringify(r);
      if(raw!==cachedRaw){state=r;norm();loading=false;renderAll();updateWelcome();try{localStorage.setItem('zc-cache',raw)}catch(e){}}
      initAnalytics();
    }else if(loading){loading=false;renderAll();updateWelcome()}
  })
}
window.addEventListener('hashchange',function(){if(location.hash==='#admin'){owner=true;try{localStorage.setItem('zc-owner','1')}catch(e){}renderAll()}});
})();
</script>

</body></html>
